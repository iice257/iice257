<svg xmlns="http://www.w3.org/2000/svg" width="1286" height="1238" viewBox="0 0 1286 1238" role="img" aria-labelledby="title desc">
  <title id="title">Kingsley Aremu portfolio-inspired GitHub profile</title>
  <desc id="desc">Portfolio-inspired GitHub profile artwork for Kingsley Afolabi Aremu, iice257, a Lagos-based full-stack and creative engineer.</desc>
