  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="7%" r="95%">
      <stop offset="0" stop-color="#151515"/>
      <stop offset="0.44" stop-color="#050505"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="spotA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spotBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7cf8ef" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#7cf8ef" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7cf8ef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spotGold" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d8c747" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#d8c747" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#d8c747" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <style>
      @keyframes twinkle {
        0%, 100% { opacity: .22; transform: scale(.78); }
        48% { opacity: .95; transform: scale(1.18); }
      }
      @keyframes drift {
        0% { transform: translateY(-18px); opacity: 0; }
        16% { opacity: .42; }
        100% { transform: translateY(64px); opacity: 0; }
      }
      .bg { fill: url(#bgGlow); }
      .nav { font: 800 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f4f4f4; letter-spacing: 4px; }
      .heroTop { font: 900 188px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f5f5f5; letter-spacing: 10px; }
      .heroBottom { font: 100 168px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: none; stroke: #f3f3f3; stroke-width: 1.8; letter-spacing: 23px; }
      .lede { font: 300 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #d9d9d9; }
      .ledeStrong { font: 800 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
      .micro { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #9b9b9b; letter-spacing: 8px; }
      .microSmall { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8e8e8e; letter-spacing: 7px; }
      .projectTitle { font: 800 23px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f2f2f2; }
      .body { font: 300 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #cfcfcf; }
      .pillText { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #eeeeee; }
      .footer { font: 300 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #d6d6d6; }
      .quote { font: italic 300 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #d7d7d7; }
      .quoteMark { font: 900 31px Georgia, serif; fill: #9ef5e9; }
      .line { stroke: #303030; stroke-width: 1; }
      .hairline { stroke: #444444; stroke-width: 1; }
      .button { fill: rgba(0,0,0,.24); stroke: #5d5d5d; stroke-width: 1; }
      .card { fill: rgba(0,0,0,.18); stroke: #383838; stroke-width: 1; }
      .pill { fill: rgba(255,255,255,.035); stroke: #4f4f4f; stroke-width: 1; }
      .icon { stroke: #f2f2f2; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .accent { stroke: #9ef5e9; }
      .star { transform-box: fill-box; transform-origin: center; animation: twinkle 5.8s ease-in-out infinite; }
      .snow { animation: drift 7s linear infinite; }
    </style>
